[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-logging-system"
version = "0.4.0"
description = "A monitor that watches your AI agents for slow responses, rising error rates, and empty outputs — and tells you which agent is broken and what to do about it."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "sshpie" }]
keywords = ["agents", "monitoring", "observability", "anomaly-detection", "multi-agent", "cisco", "mcp", "network-monitoring", "cisco-devnet"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["agent_logging_system*"]
exclude = ["tests*", "examples*"]
